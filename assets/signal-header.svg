<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">OSfrog signal header</title>
  <desc id="desc">An acid green signal scans across a dark blue header.</desc>
  <defs>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#b8ff65" stop-opacity="0"/>
      <stop offset=".48" stop-color="#b8ff65" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b8ff65" stop-opacity=".8"/>
      <stop offset=".52" stop-color="#b8ff65" stop-opacity="0"/>
      <stop offset="1" stop-color="#b8ff65" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#69d6ff" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="#05080f"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="1000" cy="52" r="160" fill="#69d6ff" fill-opacity=".07"/>
  <path d="M55 194H1145" stroke="#a8b3aa" stroke-opacity=".28"/>
  <text x="58" y="73" fill="#b8ff65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">OSFROG / ONLINE</text>
  <text x="55" y="153" fill="#f4f7f1" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-4">FULLSTACK DEVELOPER</text>
  <text x="58" y="224" fill="#a8b3aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">PRODUCTS · DEVELOPER TOOLS · CREATIVE CODE</text>
  <g transform="translate(1082 158)" fill="#b8ff65" filter="url(#glow)">
    <path d="M0 12h16V0h16v12h8V0h16v12h16v44h-12v12H12V56H0z"/>
    <path d="M12 22h12v12H12zm32 0h12v12H44zM24 48h20v6H24z" fill="#05080f"/>
  </g>
  <rect x="-340" y="0" width="340" height="260" fill="url(#scan)">
    <animate attributeName="x" values="-340;1200;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1150" cy="73" r="5" fill="#b8ff65" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
