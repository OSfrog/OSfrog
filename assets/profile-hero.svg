<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176" role="img" aria-labelledby="title desc">
  <title id="title">Tommy Le, Fullstack Developer</title>
  <desc id="desc">Tommy Le, Fullstack Developer, with a decorative acid green signal scan.</desc>
  <defs>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#b8ff65" stop-opacity="0"/>
      <stop offset=".48" stop-color="#b8ff65" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b8ff65" stop-opacity=".38"/>
      <stop offset=".52" stop-color="#b8ff65" stop-opacity="0"/>
      <stop offset="1" stop-color="#b8ff65" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="176" rx="8" fill="#0d1117"/>
  <path d="M0 175H960" stroke="#30363d"/>
  <text x="2" y="78" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-3">TOMMY LE -</text>
  <text x="2" y="145" fill="#b8ff65" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-3">FULLSTACK DEVELOPER.</text>
  <rect x="-270" y="0" width="270" height="176" fill="url(#scan)">
    <animate attributeName="x" values="-270;960;960" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
